<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>NEAR Thesis — Priced for Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#041210; --bg2:#071a17; --panel:#0a1f1b; --panel2:#0e2924;
        --line:#173a33; --line2:#24544a;
        --ink:#ecf7f3; --ink2:#a9c6bf; --ink3:#6f948c;
        --teal:#00dcb0; --teal-dim:#059669; --teal-ink:#ffffff;
        --teal-grad:linear-gradient(120deg,#059669 0%,#0d9488 52%,#14b8a6 100%);
        --amber:#f5b544; --red:#f26d6d; --green:#3ddc97; --gray:#9a93b8; --terra:#e07856;
        --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
        --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
        --rad:10px;
      }
      *{ box-sizing:border-box; }
      html{ scroll-behavior:smooth; }
      body{
        margin:0; color:var(--ink);
        font-family:var(--sans); font-size:16px; line-height:1.55;
        background-color:var(--bg);
        background-image:
          radial-gradient(ellipse 110% 560px at 50% -120px, rgba(13,148,136,.50) 0%, rgba(13,148,136,.26) 42%, rgba(4,18,16,0) 72%),
          linear-gradient(180deg, #06302a 0%, #071a17 340px, var(--bg) 640px),
          linear-gradient(rgba(0,220,176,.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,220,176,.05) 1px, transparent 1px);
        background-size:auto, auto, 44px 44px, 44px 44px;
        background-repeat:no-repeat, no-repeat, repeat, repeat;
      }
      button, [role="button"], select, summary, input:not([type="checkbox"],[type="radio"]) { min-height:2.25rem; }
      .wrap{ max-width:1180px; margin:0 auto; padding:0 20px 72px; }
      .mono{ font-family:var(--mono); }
      a{ color:var(--teal); }

      /* ---------- top bar ---------- */
      .topbar{
        position:sticky; top:0; z-index:40;
        padding:14px 0 4px;
        background:linear-gradient(180deg, rgba(4,18,16,.82), rgba(4,18,16,0));
        backdrop-filter:blur(6px);
      }
      .topbar-in{ max-width:1180px; margin:0 auto; padding:4px 20px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; }
      .top-meta{ display:flex; align-items:center; justify-content:flex-start; justify-self:start; gap:12px; flex-wrap:wrap; }
      @media (max-width:920px){
        .topbar-in{ display:flex; flex-direction:column; align-items:center; }
        .top-meta{ align-self:flex-start; justify-content:flex-start; }
        .top-actions{ align-items:center; }
        .live-status{ text-align:center; }
      }
      .frozen{
        font-family:var(--mono); font-size:9.5px; letter-spacing:.07em;
        border:1px solid var(--line2); color:var(--ink2); background:rgba(10,31,27,.6);
        padding:3px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
      }
      .frozen i{ width:5px; height:5px; border-radius:50%; background:var(--amber); display:inline-block; }
      .frozen.live i{ background:var(--green); }
      .top-actions{ justify-self:end; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
      .recheck{
        font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.04em; cursor:pointer;
        color:#041210; background:#ffffff; border:1px solid #ffffff;
        border-radius:999px; padding:8px 18px; min-height:2.25rem; white-space:nowrap;
        box-shadow:0 6px 18px rgba(0,0,0,.35);
        display:inline-flex; align-items:center; gap:8px;
      }
      .recheck:hover{ background:#e8f5f1; border-color:#e8f5f1; }
      .recheck:disabled{ opacity:.65; cursor:wait; filter:none; }
      .recheck .spin{ width:11px; height:11px; border-radius:50%; border:2px solid rgba(4,18,16,.25); border-top-color:#041210; animation:spin .7s linear infinite; display:none; flex:none; }
      .recheck.loading .spin{ display:inline-block; }
      @keyframes spin{ to{ transform:rotate(360deg); } }
      @media (prefers-reduced-motion: reduce){ .recheck .spin{ animation:none; } }
      .live-status{ font-family:var(--mono); font-size:10.5px; color:#ffffff; text-align:right; }
      .live-status.ok{ color:#ffffff; }
      .live-status.err{ color:var(--amber); }
      .topbar nav{
        margin:0 auto; justify-self:center; display:flex; gap:2px; flex-wrap:wrap; justify-content:center;
        background:rgba(5,20,17,.88); border:1px solid rgba(0,220,176,.24);
        border-radius:999px; padding:5px;
        box-shadow:0 10px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
        backdrop-filter:blur(14px);
      }
      .tabbtn{
        font-family:var(--mono); font-size:12.5px; letter-spacing:.04em;
        background:transparent; border:1px solid transparent; color:var(--ink2);
        padding:8px 14px; border-radius:999px; cursor:pointer; min-height:2.25rem;
      }
      .tabbtn:hover{ color:var(--ink); background:rgba(0,220,176,.10); }
      .tabbtn.on{ color:var(--teal-ink); background:var(--teal-grad); border-color:transparent; font-weight:600; box-shadow:0 6px 18px rgba(20,184,166,.38); }

      /* ---------- hero ---------- */
      .hero{ padding:64px 0 8px; position:relative; text-align:center; }
      .hero::before{
        content:""; position:absolute; inset:-30px -60px auto; height:420px; z-index:-1; pointer-events:none;
        background:radial-gradient(ellipse 55% 100% at 50% 0%, rgba(20,184,166,.34), rgba(13,148,136,.12) 55%, transparent 78%);
        filter:blur(6px);
      }
      .hero-tag{ font-family:var(--mono); font-size:12px; letter-spacing:.22em; color:var(--teal); margin:0 0 14px; }
      .hero h1{
        margin:0; font-size:clamp(28px,4.8vw,54px); line-height:1.14; font-weight:800;
        letter-spacing:-.015em; text-transform:uppercase;
        padding-bottom:.16em;
      }
      .hero h1 .thin{ color:var(--ink3); }
      .hero h1 .teal{
        background:linear-gradient(94deg,#ccfbf1 0%,#5eead4 30%,#00dcb0 58%,#00dcb0 100%);
        -webkit-background-clip:text; background-clip:text;
        color:transparent; -webkit-text-fill-color:transparent;
        display:inline-block; padding-bottom:.14em; margin-bottom:-.10em;
        -webkit-box-decoration-break:clone; box-decoration-break:clone;
      }
      .hero-sub{ max-width:720px; color:var(--ink2); font-size:17px; margin:10px auto 0; }
      .hero-sub b{ color:var(--ink); font-weight:600; }
      .hero-actions{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:30px; }
      .btn-solid{
        font-family:var(--sans); font-size:15.5px; font-weight:600; cursor:pointer;
        color:#ffffff; background:var(--teal-grad); border:1px solid transparent;
        border-radius:999px; padding:14px 32px; min-height:3rem;
        box-shadow:0 10px 28px rgba(20,184,166,.35);
      }
      .btn-solid:hover{ filter:brightness(1.1); }
      .btn-outline{
        font-family:var(--sans); font-size:15.5px; font-weight:600; cursor:pointer;
        color:var(--ink); background:transparent; border:1px solid rgba(0,220,176,.55);
        border-radius:999px; padding:14px 32px; min-height:3rem;
      }
      .btn-outline:hover{ background:rgba(0,220,176,.08); border-color:var(--teal); }
      a.btn-outline{ text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
      /* ---------- stat grid ---------- */
      .stats{ display:grid; grid-template-columns:repeat(3,auto); justify-content:center; gap:22px; margin:44px 0 6px; text-align:left; }
      .stat{ width:100%; min-width:220px; max-width:260px; }
      .stat{
        background:linear-gradient(180deg,var(--panel2),var(--panel));
        border:1px solid var(--line); border-radius:var(--rad); padding:12px 14px 10px;
      }
      .stat .k{ font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--ink3); text-transform:uppercase; }
      .stat .v{ font-family:var(--mono); font-size:clamp(21px,2.5vw,27px); font-weight:600; margin-top:4px; color:var(--ink); }
      .stat .v small{ font-size:.5em; color:var(--ink3); font-weight:400; }
      .stat .d{ font-size:12.5px; color:var(--ink2); margin-top:2px; }
      .stat.hot{ border-color:var(--teal-dim); }
      .stat.hot .v{ color:var(--teal); }

      /* ---------- sections ---------- */
      section.chapter{ padding:38px 0 6px; animation:fadein .35s ease both; }
      @keyframes fadein{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
      @media (prefers-reduced-motion: reduce){ section.chapter{ animation:none; } html{ scroll-behavior:auto; } }
      .ch-head{ display:flex; align-items:baseline; gap:16px; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:24px; flex-wrap:wrap; }
      .ch-num{ font-family:var(--mono); color:var(--teal); font-size:14px; letter-spacing:.1em; }
      .ch-head h2{ margin:0; font-size:clamp(26px,4vw,38px); font-weight:700; letter-spacing:-.01em; }
      .ch-head p{ margin:0 0 0 auto; color:var(--ink3); font-size:13.5px; max-width:380px; }
      .prose{ max-width:820px; color:var(--ink2); }
      .prose p{ margin:0 0 14px; }
      .prose b, .prose strong{ color:var(--ink); font-weight:600; }
      .prose h3, .subh{ font-size:21px; font-weight:700; color:var(--ink); margin:30px 0 10px; letter-spacing:-.01em; }
      .prose h3:first-child, .subh:first-child{ margin-top:0; }
      .prose h4{ font-size:16.5px; font-weight:700; color:var(--ink); margin:22px 0 8px; }
      ol.claims{ margin:6px 0 16px; padding-left:22px; color:var(--ink2); }
      ol.claims li{ margin-bottom:12px; }
      ol.claims li b{ color:var(--ink); }
      .cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--rad); padding:20px; }
      .panel h3{ margin:0 0 10px; font-size:17px; font-weight:700; }
      .panel p{ margin:0 0 10px; color:var(--ink2); font-size:14.5px; }
      .panel p:last-child{ margin-bottom:0; }
      .panel .big{ font-family:var(--mono); font-size:30px; font-weight:600; color:var(--teal); }
      ul.tight{ margin:8px 0 0; padding-left:18px; color:var(--ink2); font-size:14.5px; }
      ul.tight li{ margin-bottom:7px; }
      ul.tight b{ color:var(--ink); }

      /* pillars */
      .pillars{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:6px; }
      .pillar{ background:var(--panel); border:1px solid var(--line); border-radius:var(--rad); padding:20px; }
      .pillar .n{ font-family:var(--mono); color:var(--teal); font-size:12px; letter-spacing:.14em; }
      .pillar h3{ margin:8px 0 8px; font-size:18px; }
      .pillar p{ margin:0; color:var(--ink2); font-size:14.5px; }

      /* delta box */
      .delta{
        border:1px solid var(--teal-dim); border-radius:var(--rad);
        background:linear-gradient(180deg, rgba(0,220,176,.07), rgba(0,220,176,.02));
        padding:20px 22px; margin-top:22px;
      }
      .delta h3{ margin:0 0 4px; font-size:17px; color:var(--teal); }
      .delta .dsub{ margin:0 0 12px; font-size:13.5px; color:var(--ink3); }
      .delta ul{ margin:0; padding-left:18px; color:var(--ink2); font-size:14.5px; }
      .delta li{ margin-bottom:7px; }
      .delta li b{ color:var(--ink); font-family:var(--mono); font-weight:600; font-size:13.5px; }
      .delta .dfoot{ margin:12px 0 0; font-size:14px; color:var(--ink2); }
      .delta .dfoot b{ color:var(--teal); }

      /* ---------- figures ---------- */
      figure.fig{ margin:22px 0 8px; background:var(--panel); border:1px solid var(--line); border-radius:var(--rad); padding:18px 20px 14px; }
      .fig-head{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
      .fig-head .ft{ font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--teal); }
      .fig-head .fr{ margin-left:auto; font-family:var(--mono); font-size:13px; color:var(--ink2); }
      .fig-head .fr b{ color:var(--teal); font-weight:600; }
      .fig-ctrl{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:8px 0 4px; }
      .fig-ctrl .wl{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink3); margin-right:4px; }
      .winbtn{
        font-family:var(--mono); font-size:12px; cursor:pointer; border-radius:999px;
        border:1px solid rgba(0,220,176,.38); background:rgba(0,220,176,.04); color:var(--ink2); padding:6px 14px; min-height:2.25rem;
      }
      .winbtn:hover{ color:var(--ink); border-color:rgba(0,220,176,.65); }
      .winbtn.on{ color:var(--teal-ink); background:var(--teal-grad); border-color:transparent; font-weight:600; box-shadow:0 6px 18px rgba(20,184,166,.35); }
      .fig-legend{ display:flex; gap:16px; flex-wrap:wrap; margin-left:auto; font-size:12.5px; color:var(--ink2); }
      .fig-legend span{ display:inline-flex; align-items:center; gap:6px; }
      .fig-legend i{ width:16px; height:3px; border-radius:2px; display:inline-block; }
      .fig-legend i.dash{ height:0; border-top:2px dashed var(--amber); }
      .figbox{ position:relative; }
      .figbox svg{ display:block; width:100%; height:auto; touch-action:pan-y; }
      .figtip{
        position:absolute; pointer-events:none; z-index:5; min-width:150px;
        background:rgba(6,24,20,.96); border:1px solid var(--line2); border-radius:8px;
        padding:8px 11px; font-family:var(--mono); font-size:12px; color:var(--ink2);
        box-shadow:0 8px 24px rgba(0,0,0,.5);
      }
      .figtip .tt{ color:var(--ink); font-weight:600; margin-bottom:3px; }
      .figtip .tr{ display:flex; justify-content:space-between; gap:14px; }
      .figtip .tr b{ color:var(--ink); font-weight:600; }
      figcaption{ font-size:13.5px; color:var(--ink3); margin-top:10px; line-height:1.5; }
      figcaption b{ color:var(--ink2); }

      /* ---------- data tables ---------- */
      .tblwrap{ margin:14px 0 6px; }
      table.dtable{ width:100%; border-collapse:collapse; font-size:14px; }
      table.dtable th{ text-align:left; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--ink3); font-weight:500; padding:9px 10px; border-bottom:1px solid var(--line2); }
      table.dtable td{ padding:10px; border-bottom:1px solid var(--line); color:var(--ink2); vertical-align:top; }
      table.dtable td.n, table.dtable th.n{ font-family:var(--mono); color:var(--ink); white-space:nowrap; }
      table.dtable td b{ color:var(--ink); }
      table.dtable tr.hl td{ background:rgba(0,220,176,.06); }
      table.dtable tr.total td{ border-top:1px solid var(--line2); color:var(--ink); font-weight:600; }
      .tbl-cap{ font-size:13px; color:var(--ink3); margin-top:8px; }
      .tbl-cap b{ color:var(--ink2); }
      .wallet{ font-family:var(--mono); font-size:12.5px; color:var(--teal); word-break:break-all; }

      /* kv table */
      table.kv{ width:100%; border-collapse:collapse; font-size:14.5px; }
      table.kv td{ padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
      table.kv td:first-child{ font-family:var(--mono); font-size:12.5px; color:var(--ink3); width:38%; letter-spacing:.03em; }
      table.kv td:last-child{ color:var(--ink2); }
      table.kv b{ color:var(--ink); }
      table.kv .mono{ color:var(--ink); }

      .callout{
        border:1px solid rgba(245,181,68,.45); background:rgba(245,181,68,.06);
        border-radius:var(--rad); padding:18px 20px; margin-top:14px;
      }
      .callout h3{ margin:0 0 6px; font-size:16px; color:var(--amber); }
      .callout p{ margin:0; color:var(--ink2); font-size:14.5px; }
      .verdictpanel{
        border:1px solid var(--teal-dim); background:rgba(0,220,176,.05);
        border-radius:var(--rad); padding:20px 22px; margin-top:16px;
      }
      .verdictpanel h3{ margin:0 0 8px; font-size:17px; color:var(--teal); }
      .verdictpanel p{ margin:0; color:var(--ink2); font-size:15px; }

      .codeblock{
        background:#071a17; border:1px solid var(--line); border-radius:8px;
        padding:14px 16px; margin:10px 0 16px; overflow:hidden;
      }
      .codeblock .cb-t{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink3); margin-bottom:8px; }
      .codeblock pre{ margin:0; font-family:var(--mono); font-size:12px; line-height:1.6; color:var(--ink2); white-space:pre-wrap; word-break:break-word; }

      .ctl label{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:12.5px; color:var(--ink2); margin-bottom:2px; }
      .ctl label output{ color:var(--teal); font-weight:600; }
      .ctl .hint{ font-size:12px; color:var(--ink3); margin:0 0 4px; }
      input[type="range"]{ width:100%; accent-color:var(--teal); height:36px; cursor:pointer; }
      .resetbtn{
        margin-top:8px; font-family:var(--mono); font-size:12.5px; cursor:pointer;
        background:rgba(0,220,176,.04); color:var(--ink2); border:1px solid rgba(0,220,176,.38);
        border-radius:999px; padding:8px 18px;
      }
      .resetbtn:hover{ color:var(--ink); border-color:rgba(0,220,176,.7); background:rgba(0,220,176,.10); }

      /* ---------- calculator ---------- */
      .calc{ display:grid; grid-template-columns:340px 1fr; gap:14px; align-items:stretch; }
      .calc-out{
        border:1px solid var(--teal-dim); border-radius:var(--rad);
        background:radial-gradient(120% 140% at 20% 0%, rgba(0,220,176,.14), rgba(0,220,176,.03));
        padding:22px; display:flex; flex-direction:column; justify-content:center;
      }
      .calc-out .k{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--ink3); }
      .calc-out .v{ font-family:var(--mono); font-size:clamp(40px,5vw,58px); font-weight:600; color:var(--teal); line-height:1.05; margin:6px 0 2px; }
      .calc-out .v small{ font-size:.38em; color:var(--ink2); font-weight:400; }
      .calc-out .mult{ font-family:var(--mono); font-size:16px; color:var(--ink); }
      .calc-out .mult b{ color:var(--amber); }
      .calc-out .note{ font-size:13px; color:var(--ink2); margin-top:10px; }
      .presets{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
      .preset{
        font-family:var(--mono); font-size:12px; cursor:pointer; border-radius:999px;
        border:1px solid rgba(0,220,176,.38); background:rgba(0,220,176,.04); color:var(--ink2); padding:8px 16px;
      }
      .preset:hover{ color:var(--ink); border-color:rgba(0,220,176,.65); }
      .preset.on{ color:var(--teal-ink); background:var(--teal-grad); border-color:transparent; font-weight:600; box-shadow:0 6px 18px rgba(20,184,166,.35); }
      .bar-wrap{ margin-top:16px; }
      .bar-lab{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--ink3); margin-bottom:5px; }
      .bar-track{ height:10px; background:#0d2a24; border-radius:99px; position:relative; overflow:hidden; }
      .bar-fill{ height:100%; background:linear-gradient(90deg,#059669,#14b8a6); border-radius:99px; transition:width .3s ease; }
      .bar-now{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--amber); }
      .formula{ font-family:var(--mono); font-size:12.5px; color:var(--ink3); margin-top:12px; word-break:break-word; }

      /* ---------- sensitivity grid ---------- */
      .gridwrap{ overflow:hidden; border:1px solid var(--line); border-radius:var(--rad); margin-top:14px; }
      table.sens{ border-collapse:collapse; width:100%; font-family:var(--mono); font-size:13.5px; }
      table.sens th, table.sens td{ padding:11px 8px; text-align:center; border-bottom:1px solid var(--line); }
      table.sens thead th{ background:var(--panel2); color:var(--ink2); font-weight:500; font-size:12px; letter-spacing:.05em; }
      table.sens tbody th{ background:var(--panel2); color:var(--ink2); font-weight:500; font-size:12px; }
      table.sens td{ cursor:pointer; color:var(--ink2); }
      table.sens td:hover{ color:var(--ink); background:rgba(0,220,176,.08); }
      table.sens td.base{ background:rgba(0,220,176,.16); color:var(--teal); font-weight:600; outline:1px solid var(--teal-dim); outline-offset:-1px; }
      table.sens td small{ display:block; font-size:10.5px; color:var(--ink3); }
      table.sens td.base small{ color:var(--teal); }
      .grid-note{ font-size:13px; color:var(--ink3); margin-top:10px; }

      /* scenarios */
      .scen{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px; }
      .sc{ border:1px solid var(--line); border-radius:var(--rad); padding:18px; background:var(--panel); }
      .sc .k{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; }
      .sc.bear .k{ color:var(--red); } .sc.base .k{ color:var(--amber); } .sc.bull .k{ color:var(--green); }
      .sc .v{ font-family:var(--mono); font-size:28px; font-weight:600; margin:6px 0 2px; }
      .sc .f{ font-family:var(--mono); font-size:12.5px; letter-spacing:.06em; color:var(--ink3); margin:0 0 8px; }
      .sc .f b{ color:var(--ink); font-weight:600; }
      .sc p{ margin:0; font-size:13.5px; color:var(--ink2); }

      footer{ margin-top:56px; border-top:1px solid var(--line); padding-top:20px; display:flex; gap:14px; flex-wrap:wrap; justify-content:space-between; }
      footer p{ margin:0; font-family:var(--mono); font-size:12px; color:var(--ink3); max-width:560px; }
      .fallback{ padding:80px 24px; text-align:center; font-family:var(--mono); color:var(--ink2); }

      @media (max-width:900px){
        .stats{ grid-template-columns:repeat(2,auto); justify-content:center; }
        .pillars, .scen{ grid-template-columns:1fr; }
        .calc{ grid-template-columns:1fr; }
        .cols{ grid-template-columns:1fr; }
        .ch-head p{ margin:6px 0 0; }
      }
      @media (max-width:700px){
        table.dtable{ font-size:12.5px; }
        table.dtable th, table.dtable td{ padding:8px 6px; }
        table.dtable td.n, table.dtable th.n{ white-space:normal; }
        .wallet{ font-size:11px; }
        figure.fig{ padding:14px 12px 10px; }
      }
      @media (max-width:640px){
        .stat{ min-width:0; }
        table.sens{ font-size:12px; table-layout:fixed; }
        table.sens th, table.sens td{ padding:9px 2px; }
        table.sens thead th:first-child{ font-size:9.5px; letter-spacing:0; width:19%; }
        table.sens td small{ font-size:9.5px; }
      }
      @media (max-width:520px){
        .stats{ grid-template-columns:auto auto; justify-content:center; }
        .stat{ padding:10px 12px 8px; min-width:0; max-width:100%; }
        .stat .v{ font-size:20px; }
        .topbar nav{ margin:6px auto 0; }
      }
    </style>
  </head>

    function useCountUp(target, dur){
      const [v, setV] = useState(0);

        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){ setV(target); return; }

        const step = (t) => { if (!t0) t0 = t; const p = Math.min(1, (t - t0) / (dur || 900));

      return v;
